name: Build KyrVPN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/kyrvpn/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KyrVPN"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kyrvpn.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.kyrvpn.app"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="KyrVPN"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".KyrVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>

                  </service>

              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101014</item>
                  <item name="android:navigationBarColor">#101014</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/kyrvpn/app/MainActivity.java <<'EOF'
          package com.kyrvpn.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(40, 40, 40, 40);
                  layout.setBackgroundColor(Color.rgb(16,16,20));

                  TextView title = new TextView(this);
                  title.setText("🛡️ KyrVPN");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(30);
                  title.setGravity(Gravity.CENTER);

                  status = new TextView(this);
                  status.setText("Не подключено");
                  status.setTextColor(Color.LTGRAY);
                  status.setTextSize(20);
                  status.setGravity(Gravity.CENTER);

                  Button connect = new Button(this);
                  connect.setText("ПОДКЛЮЧИТЬ");
                  connect.setTextSize(18);

                  TextView server = new TextView(this);
                  server.setText("🌍 Германия");
                  server.setTextColor(Color.WHITE);
                  server.setTextSize(18);
                  server.setGravity(Gravity.CENTER);

                  layout.addView(title);
                  layout.addView(status);
                  layout.addView(connect);
                  layout.addView(server);

                  setContentView(layout);

                  connect.setOnClickListener(v -> {
                      Intent intent = VpnService.prepare(this);

                      if (intent != null) {
                          startActivityForResult(intent, 100);
                      } else {
                          startVpn();
                      }
                  });
              }

              private void startVpn() {
                  Intent intent = new Intent(this, KyrVpnService.class);
                  startService(intent);
                  status.setText("🟢 VPN запущен");
              }
          }
          EOF

          cat > app/src/main/java/com/kyrvpn/app/KyrVpnService.java <<'EOF'
          package com.kyrvpn.app;

          import android.net.VpnService;
          import android.os.ParcelFileDescriptor;

          public class KyrVpnService extends VpnService {

              private ParcelFileDescriptor vpnInterface;

              @Override
              public int onStartCommand(android.content.Intent intent, int flags, int startId) {

                  Builder builder = new Builder();

                  builder.setSession("KyrVPN");
                  builder.addAddress("10.0.0.2", 32);
                  builder.addRoute("0.0.0.0", 0);

                  vpnInterface = builder.establish();

                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  try {
                      if (vpnInterface != null) {
                          vpnInterface.close();
                      }
                  } catch (Exception ignored) {}

                  super.onDestroy();
              }
          }
          EOF

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KyrVPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
